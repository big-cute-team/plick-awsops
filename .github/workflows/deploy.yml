name: Deploy to EC2

# main 푸시 → EC2에 반영.
#
# EC2가 프라이빗 서브넷에 있어 인바운드 접속(SSH)이 없다. 그래서 러너가 EC2에
# 접속하는 대신 SSM Send Command로 명령을 밀어넣는다. 자격증명은 OIDC로 받으므로
# 저장된 액세스 키가 없다.
#
# The EC2 instance is in a private subnet with no inbound access, so instead of the
# runner connecting to it, we push commands via SSM Send Command. Credentials come
# from GitHub OIDC — no long-lived access keys are stored.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 git reset 과 npm run build 가 서로를 덮어쓴다. 순차 실행을 강제한다.
# Overlapping deploys would have git reset and npm build stomp on each other.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC 토큰 발급에 필요 / required to request the OIDC token
  contents: read

env:
  AWS_REGION: ap-northeast-2
  APP_DIR: /home/ec2-user/plick-awsops

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev          # OIDC subject 조건과 일치해야 한다 / must match the role's sub condition
    timeout-minutes: 30
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::815090125359:role/plick-awsops-github-role-dev
          aws-region: ${{ env.AWS_REGION }}

      # 인스턴스 ID를 하드코딩하지 않는다. EC2를 다시 만들면 ID가 바뀌지만
      # Name 태그(awsops-server)는 CDK가 항상 붙인다.
      # Resolve by tag rather than hardcoding: the instance ID changes if EC2 is
      # recreated, but CDK always sets the Name tag.
      - name: Resolve instance ID
        id: target
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=awsops-server" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "::error::No running instance tagged Name=awsops-server"
            exit 1
          fi
          echo "instance_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Target: $ID"

      - name: Send deploy command
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.target.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7} by ${GITHUB_ACTOR}" \
            --parameters commands='[
              "set -euo pipefail",
              "LOCK=/var/tmp/awsops-deploy.lock",
              "for i in $(seq 1 120); do mkdir $LOCK 2>/dev/null && break; if [ -f $LOCK/pid ] && ! kill -0 $(cat $LOCK/pid) 2>/dev/null; then rm -rf $LOCK; continue; fi; [ $i = 1 ] && echo \"waiting for $(cat $LOCK/owner 2>/dev/null)\"; [ $i = 120 ] && { echo \"::error::deploy lock held by $(cat $LOCK/owner 2>/dev/null)\"; exit 1; }; sleep 10; done",
              "echo github-actions-${{ github.sha }} > $LOCK/owner; echo $$ > $LOCK/pid",
              "trap \"rm -rf $LOCK\" EXIT",
              "sudo -u ec2-user bash -lc \"cd ${{ env.APP_DIR }} && git fetch --all --prune && git reset --hard ${{ github.sha }}\"",
              "sudo -u ec2-user bash -lc \"cd ${{ env.APP_DIR }} && npm ci\"",
              "sudo -u ec2-user bash -lc \"cd ${{ env.APP_DIR }} && npm run build\"",
              "systemctl restart awsops",
              "sleep 5",
              "curl -fsS -o /dev/null -w \"health: HTTP %{http_code}\\n\" http://localhost:3000/"
            ]' \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Command: $CMD_ID"

      # send-command 는 명령을 큐에 넣기만 하고 즉시 반환한다. 결과를 폴링하지 않으면
      # 빌드가 깨져도 워크플로가 초록색으로 끝난다.
      # send-command only queues the command. Without polling, a broken build would
      # still leave the workflow green.
      - name: Wait for completion
        run: |
          CMD="${{ steps.send.outputs.command_id }}"
          ID="${{ steps.target.outputs.instance_id }}"
          for i in $(seq 1 100); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "[$i] $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "::error::Deploy failed with status $STATUS"
                aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
                  --query 'StandardErrorContent' --output text
                exit 1 ;;
            esac
            if [ "$i" = "100" ]; then
              echo "::error::Timed out waiting for the deploy command"
              exit 1
            fi
          done
          echo "--- output ---"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
            --query 'StandardOutputContent' --output text | tail -20

      - name: Verify from the public endpoint
        run: |
          # ALB 뒤에는 Cognito 인증이 걸려 있어 302(로그인 리다이렉트)가 정상 응답이다.
          # Cognito auth fronts the ALB, so a 302 to the login page is the healthy response.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://awsops.plick.co.kr/)
          echo "https://awsops.plick.co.kr/ → HTTP $CODE"
          case "$CODE" in
            200|302) echo "OK" ;;
            *) echo "::error::Unexpected status $CODE"; exit 1 ;;
          esac
